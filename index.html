  shortlistAdd: (a) => { const s = SOURCED.find((x) => x.id === a), before = [SOURCED, CANDS]; SOURCED = SOURCED.map((x) => (x.id === a ? { ...x, short: true } : x)); CANDS = [{ id: s.id, ar: s.ar, en: s.en, p: s.p, match: s.match, stage: "shortlisted", exp: 5, insight: { ar: "أُضيف من نتائج Hiro:Seek", en: "Added from Hiro:Seek results" }, next: "connect" }, ...CANDS]; render(); notify(t(`أُضيف ${L(s)} إلى القائمة المختصرة.`, `${L(s)} added to the shortlist.`), () => { [SOURCED, CANDS] = before; render(); }); },
  projToggle: (a) => { const flip = () => { P[a].status = P[a].status === "active" ? "paused" : "active"; render(); }; flip(); notify(P[a].status === "active" ? t(`هيرو يعمل على مشروع ${L(P[a])}.`, `Hiro is running on ${L(P[a])}.`) : t(`أُوقف هيرو في مشروع ${L(P[a])}.`, `Hiro paused on ${L(P[a])}.`), flip); },
  ask: (a) => { S.brainQ = L(ANSWERS[a].q); S.answer = { key: a, q: S.brainQ }; render(); },
  chartTable: () => { S.chartTable = !S.chartTable; render(); },
  resume: () => { S.cancelled = false; render(); notify(t(`استُؤنف الاشتراك. الدفعة القادمة في ${chargeDate()}.`, `Subscription resumed. Next payment on ${chargeDate()}.`), () => { S.cancelled = true; render(); }); },
  clearFilters: () => { S.q = ""; S.fProject = "all"; S.fStage = "all"; render(); const el = document.getElementById("q"); if (el) el.focus(); },
  saveContact: () => { const before = SAVED; SAVED = [...SAVED, { ar: "دانة السبيعي", en: "Dana Alsubaie", title: { ar: "أخصائية توظيف أولى، الرياض", en: "Senior recruiter, Riyadh" } }]; S.enrichResult = false; S.enrichQ = ""; render(); notify(t("حُفظت دانة السبيعي في جهات الاتصال.", "Dana Alsubaie saved to contacts."), () => { SAVED = before; render(); }); },
  proto: () => notify(t("نموذج أولي: هذه الخطوة تفتح صفحتها في المنتج الكامل.", "Prototype: this step opens its own page in the full product.")),
  dlg: (a, el) => openDialog(a, `[data-act="dlg"][data-arg="${a}"]`), dlgCancel: closeDialog,
  undo: () => { const u = toastUndo; toastEl.innerHTML = ""; toastUndo = null; clearTimeout(toastTimer); if (u) u(); },
  toastClose: () => { toastEl.innerHTML = ""; toastUndo = null; clearTimeout(toastTimer); },
};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return; ACTIONS[el.dataset.act](el.dataset.arg, el); });
document.addEventListener("change", (e) => { const el = e.target; if (el.type === "checkbox" && el.dataset.act) ACTIONS[el.dataset.act](el.dataset.arg, el); });
document.addEventListener("input", (e) => { const el = e.target; if (!el.dataset || !el.dataset.model) return; S[el.dataset.model] = el.value; if (el.dataset.live) render(); });
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "dlgForm") submitDialog(e.target);
  else if (e.target.id === "brainForm") { const q = S.brainQ.trim(); if (!q) return; const k = Object.keys(ANSWERS).find((k) => ANSWERS[k].q && (ANSWERS[k].q.ar === q || ANSWERS[k].q.en === q)) || "free"; S.answer = { key: k, q }; render(); }
  else if (e.target.id === "enrichForm") { const ok = /linkedin\.com\/in\/.+/i.test(S.enrichQ); S.enrichErr = !ok; S.enrichResult = ok; render(); if (!ok) document.getElementById("enrichQ").focus(); }
});
/* Agent tabs on the dashboard: arrows (mirrored in RTL), Home, End. Focus stays on the tab. */
document.addEventListener("keydown", (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"]'); if (!tab) return;
  const i = AGENTS.findIndex((a) => a.id === tab.dataset.arg), rtl = S.lang === "ar", fwd = rtl ? "ArrowLeft" : "ArrowRight", back = rtl ? "ArrowRight" : "ArrowLeft";
  const n = e.key === fwd ? (i + 1) % 5 : e.key === back ? (i + 4) % 5 : e.key === "Home" ? 0 : e.key === "End" ? 4 : null;
  if (n === null) return; e.preventDefault(); S.dashAgent = AGENTS[n].id;
  try { history.replaceState(null, "", "#dash-" + S.dashAgent); } catch (err) {}
  render(); const el = document.getElementById("tab-" + S.dashAgent); el.focus(); el.scrollIntoView({ block: "nearest", inline: "nearest" });
});
/* Route lives in the hash: #dashboard, #dash-voice, #shortlist ... so reload and shared links land in the same place. */
function readHash() {
  const h = location.hash.slice(1), prev = S.route;
  if (h.startsWith("dash-") && AGENT[h.slice(5)]) { S.route = "dashboard"; S.dashAgent = h.slice(5); }
  else if (VIEWS[h]) S.route = h; else S.route = "dashboard";
  render(); if (prev !== S.route) scrollTo(0, 0);
}
addEventListener("hashchange", readHash);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!S.theme) render(); });
readHash();
</script>
